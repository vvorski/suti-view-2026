<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the canvas runs under the notch/home indicator.
         user-scalable=no because pinch-zoom on a fullscreen canvas is only ever
         an accident. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#05060a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>suti-view</title>
    <style>
      :root {
        color-scheme: dark;
        /* Overwritten per-build by release-tone.ts before the gate paints. */
        --tone-hue: 220;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: #05060a;
        color: #cfd3dd;
        font:
          400 16px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        overflow: hidden;
        /* No rubber-band scroll or double-tap zoom over the canvas. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      #canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      /* Opacity, not display: a shake fires inside the render loop and the
         transition needs a frame to actually animate rather than jumping
         straight to invisible. Layered above the canvas, below the gate. */
      #shake-flash {
        position: fixed;
        inset: 0;
        z-index: 5;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        /* 260ms → 450ms: long enough to register on a screen someone is
           also physically shaking, still clearly shorter than the double's
           340ms two-pulse sequence below. */
        transition: opacity 450ms ease-out;
      }
      #shake-flash.on {
        opacity: 0.9;
        transition: none;
      }
      /* A double gets a second pulse rather than a longer one, so the two
         read as two events on screen the same way the buzz makes them read
         as two events by feel. */
      /* The app's own R-channel tint (see CHANNELS in hud.ts), reused rather
         than inventing a second red nobody chose on purpose — one colour
         language for "red" across the whole HUD. */
      #shake-flash.double {
        background: #ff4d5e;
        animation: shake-flash-double 340ms ease-out;
      }
      @keyframes shake-flash-double {
        0%   { opacity: 0.9; }
        35%  { opacity: 0.15; }
        55%  { opacity: 0.9; }
        100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #shake-flash { transition: none; }
        #shake-flash.double { animation: none; }
      }
      /* The gate is an overlay on the running piece, not a page in front of it.
         The canvas behind is already drawing (see idleParams in main.ts), so
         this screen's job is to stay out of its way and still be readable.

         Stripped to Start and the code. The two paragraphs that used to sit
         here are gone at Victor's instruction; what that removed is noted in
         the commit, because one of them carried the promise the page makes
         about the microphone. */
      #gate {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: flex-end;
        gap: clamp(1rem, 3.5vh, 1.9rem);
        padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.5rem
          calc(1.75rem + env(safe-area-inset-bottom, 0px));
        text-align: right;
        z-index: 10;
        transition: opacity 700ms ease;
        /* Dark where the words are, clear where the picture is. Without this
           the type sits on whatever the visualiser happens to be doing and
           becomes unreadable a few seconds in. */
        background: linear-gradient(
          to bottom,
          rgba(5, 6, 10, 0.06) 0%,
          rgba(5, 6, 10, 0.4) 42%,
          rgba(5, 6, 10, 0.86) 74%,
          rgba(5, 6, 10, 0.95) 100%
        );
      }
      #gate[hidden] { display: none; }
      #gate.fading { opacity: 0; pointer-events: none; }

      /* Title and build name, right-justified and large. With the copy gone
         these are the only type on the screen, so they carry it. */
      .gate-head { text-align: right; }
      /* Byline (queue entry 10). Quieter than .gate-name below it: this screen
         has exactly one thing designed to dominate — the filled Start disc —
         and a byline loud enough to compete with the title would be a second
         one. */
      .gate-byline {
        font: 400 0.62rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #454b5c;
        margin: 0 0 0.3rem;
      }
      #gate h1 {
        font-family: 'Chakra Petch', ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(1.7rem, 9vw, 2.6rem);
        font-weight: 600;
        letter-spacing: 0.24em;
        /* Optical alignment: the tracking adds a phantom space after the last
           glyph, which on a right-justified line is a visible indent. */
        margin: 0 -0.24em 0.25rem 0;
        text-transform: uppercase;
        color: #eceaf8;
        text-shadow: 0 1px 14px rgba(5, 6, 10, 0.95);
        line-height: 1;
      }
      .gate-name {
        font: 500 clamp(0.95rem, 4.4vw, 1.3rem)/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.2em;
        margin-right: -0.2em;
        text-transform: uppercase;
        color: #8d88b8;
        text-shadow: 0 1px 12px rgba(5, 6, 10, 0.95);
      }

      /* The only filled shape on the screen, so the action needs no words. */
      #start {
        appearance: none;
        cursor: pointer;
        flex: none;
        width: min(36vw, min(20vh, 8rem));
        aspect-ratio: 1;
        border-radius: 50%;
        border: none;
        background: #9d9bf0;
        color: #05060a;
        font-family: 'Chakra Petch', ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(0.95rem, 4vw, 1.15rem);
        font-weight: 700;
        letter-spacing: 0.14em;
        text-indent: 0.14em;
        text-transform: uppercase;
        /* Two periods that don't divide into one another (3.4s, 5.9s), so the
           pair returns to the same phase roughly every 200s rather than every
           cycle — what keeps this reading as alive rather than as a metronome. */
        animation: start-pulse 3.4s ease-out infinite,
          start-breathe 5.9s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
        transition: background 180ms ease, transform 180ms ease;
      }
      /* One slow ring leaving the button — the only motion this screen adds to
         what the visualiser is already doing, and it exists to say which of the
         things on screen is the one to press. */
      @keyframes start-pulse {
        0% { box-shadow: 0 0 0 0 rgba(157, 155, 240, 0.4); }
        70% { box-shadow: 0 0 0 18px rgba(157, 155, 240, 0); }
        100% { box-shadow: 0 0 0 0 rgba(157, 155, 240, 0); }
      }
      /* A slow breathe, lightly — about 4px of growth on a 114px disc. The
         `scale` property, not `transform: scale()`: #start:active already
         animates `transform`, which would silently outrank and delete the
         press feedback if this used the same property. `alternate` mirrors
         the easing at both ends, so it dwells the way breathing does, where a
         0-100% keyframe loop would snap back instead. */
      @keyframes start-breathe {
        from { scale: 1; }
        to { scale: 1.035; }
      }
      #start:hover,
      #start:focus-visible { background: #b9b7ff; }
      #start:active { transform: scale(0.97); }
      #start:disabled { background: #4a4870; color: #14141f; cursor: default; animation: none; }

      /* Bigger than Start on purpose (queue entry 4): handing the link to
         someone in the room is one of two things this screen is for, and at
         the old 80px the code was a footnote. clamp(9rem, 48vw, 10.5rem) is
         ~154px at 320px width, ~154px at 360, capped at 168px above that —
         chosen to land close to the ~155px target without depending on any
         one viewport width exactly. */
      .gate-qr {
        width: clamp(9rem, 48vw, 10.5rem);
        height: clamp(9rem, 48vw, 10.5rem);
        display: block;
        opacity: 0.9;
      }
      .gate-qr[hidden] { display: none; }

      /* Share, as an icon in the top-right corner. Circular and the same size
         as a HUD chip, because it is the same kind of object — see the
         no-straight-lines rule in CLAUDE.md. */
      .gate-share {
        position: absolute;
        top: calc(1.1rem + env(safe-area-inset-top, 0px));
        right: calc(1.1rem + env(safe-area-inset-right, 0px));
        appearance: none;
        cursor: pointer;
        width: 2.9rem;
        height: 2.9rem;
        padding: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(12, 12, 26, 0.7);
        border: 1px solid rgba(44, 41, 71, 0.9);
        color: #b9bece;
        transition: border-color 160ms ease, color 160ms ease;
      }
      .gate-share:hover,
      .gate-share:focus-visible { border-color: #9d9bf0; color: #f0eeff; }
      .gate-share svg { width: 19px; height: 19px; display: block; }
      /* Says "copied" without a word, for the desktop fallback path. */
      .gate-share.done { border-color: #5fe3a1; color: #5fe3a1; }

      #error {
        position: relative;
        color: #d08a8a;
        background: rgba(42, 20, 20, 0.92);
        padding: 0.5rem 0.7rem;
        font-size: 0.76rem;
        max-width: 22rem;
        text-align: left;
      }
      #error:empty { display: none; }

      @media (prefers-reduced-motion: reduce) {
        #start { animation: none; }
      }

    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <!-- Debug-only: flashes white on a detected shake, so "did anything fire"
         is answerable by eye when the phone that reported the bug is not
         wired to a console. See shakeFlash() in main.ts. -->
    <div id="shake-flash" aria-hidden="true"></div>

    <div id="gate">
      <!-- Share, top right. An icon rather than a labelled button: the only
           other control on this screen is Start, so there is nothing for a
           word to disambiguate it from. -->
      <button id="share" type="button" class="gate-share" aria-label="Share this page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 15.5V3.4" />
          <path d="M7.6 7.8 12 3.4l4.4 4.4" />
          <path d="M4.8 13.4v5.4a1.8 1.8 0 0 0 1.8 1.8h10.8a1.8 1.8 0 0 0 1.8-1.8v-5.4" />
        </svg>
      </button>

      <header class="gate-head">
        <p class="gate-byline">by flyflyfly &copy; 2026</p>
        <h1>suti&#8202;&middot;&#8202;view</h1>
        <div class="gate-name"><span id="release-name"></span></div>
      </header>

      <button id="start" type="button">Start</button>

      <svg id="qr" class="gate-qr" role="img" aria-label="QR code linking to this page"></svg>

      <div id="error" role="status" aria-live="polite"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
