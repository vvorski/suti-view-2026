<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the canvas runs under the notch/home indicator.
         user-scalable=no because pinch-zoom on a fullscreen canvas is only ever
         an accident. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#05060a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>suti-view</title>
    <style>
      :root {
        color-scheme: dark;
        /* Overwritten per-build by release-tone.ts before the gate paints. */
        --tone-hue: 220;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background: #05060a;
        color: #cfd3dd;
        font:
          400 16px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        overflow: hidden;
        /* No rubber-band scroll or double-tap zoom over the canvas. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      #canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #gate {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem;
        text-align: center;
        background: #05060a;
        z-index: 10;
        transition: opacity 600ms ease;
        /* The per-release glow: a soft ring inset from the viewport edges,
           tinted by --tone-hue. Subtle enough not to read as "coloured
           screen", visible enough to notice a fresh build landed. */
        box-shadow: inset 0 0 min(22vh, 200px) hsla(var(--tone-hue), 65%, 55%, 0.16);
      }
      #gate[hidden] {
        display: none;
      }
      #gate.fading {
        opacity: 0;
        pointer-events: none;
      }
      #gate h1 {
        font-size: 1.05rem;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #6f7789;
      }
      #gate p {
        max-width: 26rem;
        font-size: 0.9rem;
        color: #565d6d;
        text-wrap: balance;
      }
      #start {
        appearance: none;
        border: 1px solid #2a3040;
        background: transparent;
        color: #cfd3dd;
        font: inherit;
        font-size: 0.95rem;
        letter-spacing: 0.08em;
        padding: 0.85rem 2.5rem;
        border-radius: 999px;
        cursor: pointer;
        transition:
          border-color 200ms ease,
          color 200ms ease;
      }
      #start:hover,
      #start:focus-visible {
        border-color: #4a5468;
        color: #fff;
      }
      #start:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #error {
        color: #8a6b6b;
        font-size: 0.85rem;
        max-width: 26rem;
        min-height: 1.5em;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div id="gate">
      <h1>suti&#8202;·&#8202;view</h1>
      <p>
        Listens through the microphone and renders what it hears. Nothing is recorded,
        stored, or sent anywhere &mdash; the audio never leaves this device.
      </p>
      <button id="start" type="button">Begin</button>
      <div id="error" role="status" aria-live="polite"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
