name: Checks

# This was the Cloudflare Pages deploy. Cloudflare is parked: the deploy step
# needed CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets,
# they were never set, and so every push to main produced a red X for a target
# nobody was reading. GitHub Pages carries the site on its own.
#
# The file survives rather than being deleted because the deploy was only its
# last step. Everything above it — lint, typecheck, build, and now the probes —
# is the only CI this repo has that pages.yml does not duplicate: that workflow
# runs `pnpm build` (which does typecheck) but never `pnpm lint`. Deleting this
# to silence the X would have quietly dropped the lint gate.
#
# To bring Cloudflare back: add the two secrets, then restore the step from
# git history (`git log -- .github/workflows/deploy.yml`).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # vite.config.ts shells out to `git rev-list --count HEAD` for the
          # on-screen build number — needs full history, not the default
          # shallow clone, or it undercounts (and would disagree with the
          # GitHub Pages build of the same commit).
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck and build
        run: pnpm build

      # The headless probes. None of these touch the network or a browser, and
      # they are the regression guards for things that each shipped broken and
      # silent once already — so they belong somewhere that runs without
      # anyone remembering to.
      #
      # docs/todo.md entry 120 added probe:camera-arm, and the reason is the
      # entry itself: armed camera mode died after fifteen seconds on every
      # device with no motion data, from build 372 to build 420, and the probe
      # that would have caught it existed the whole time — it simply had no
      # case for a silent sensor and was not run here.
      - name: Probes
        run: |
          pnpm probe
          pnpm probe:shake
          pnpm probe:fullscreen
          pnpm probe:camera-arm
          pnpm probe:raise-camera
