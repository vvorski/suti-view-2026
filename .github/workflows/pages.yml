name: GitHub Pages

# The deploy. The only one — Cloudflare is parked (see checks.yml), and was
# never really deploying anyway: its token was never set, so every push to main
# produced a red X beside this workflow's green tick.
#
# Written as the fallback, and it became the whole thing for exactly the reason
# it was worth having: a github.io URL needs nothing but a public repo — no
# account, no token, no dashboard visit.
#
# BASE_PATH is the one thing a second host would have to differ on: GitHub
# serves under /<repo>/, Cloudflare served at the root of its own subdomain.
# vite.config.ts reads it and defaults to "/", so bringing a second host back
# needs no change here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a Pages deploy midway — a half-published site is worse than a
# stale one. Queue instead.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vite.config.ts shells out to `git rev-list --count HEAD` for the
          # on-screen build number — needs full history, not the default
          # shallow clone, or it undercounts (and would disagree with the
          # locally-built Cloudflare deploy of the same commit).
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build
        run: pnpm build
        env:
          # configure-pages resolves this to "/<repo>/" for a project site.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
