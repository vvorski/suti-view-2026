<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>hud probe</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060c; overflow: hidden; }
  #tag {
    position: fixed; top: 4px; left: 6px; z-index: 99;
    font: 11px ui-monospace, monospace; color: #0f0; background: #000a; padding: 2px 5px;
  }
</style>
<div id="tag">boot</div>
<script type="module">
  import { createHud } from '/src/hud.ts'

  const calls = []
  const prefs = {
    geometricView: 'circles',
    geoColour: { r: 1, g: 0.3, b: 0.4 },
    atmosphericView: 'field',
    mergeMode: 'normal',
    mix: 0.62,
    geoAlpha: 0.62,
    atmAlpha: 1,
    mapping: 'relative',
    passthrough: 0,
    autopilot: true,
    showStats: false,
  }
  const log = (n) => (...a) => calls.push([n, JSON.stringify(a)])
  const hud = createHud(prefs, {
    onGeometricView: log('geometricView'),
    onGeoColour: log('geoColour'),
    onAtmosphericView: log('atmosphericView'),
    onMergeMode: log('mergeMode'),
    onGeoAlpha: log('geoAlpha'),
    onAtmAlpha: log('atmAlpha'),
    onMapping: log('mapping'),
    onManualChange: log('manualChange'),
    // Grants whatever is asked for. The refusal path is the camera probe's
    // job; here the point is only that the ring's commit round-trips through
    // a promise and lands back on the control.
    onPassthrough: (m) => {
      calls.push(['passthrough', JSON.stringify([m])])
      return Promise.resolve(m)
    },
  })
  window.calls = calls

  // The HUD opens on a document-level pointerup whose travel is under
  // TAP_SLOP_PX. Synthesise a real tap rather than reaching inside the module:
  // this file uses setPointerCapture, so anything that bypasses real
  // PointerEvents proves less than it looks like it does.
  const at = (type, x, y) =>
    document.elementFromPoint(x, y)?.dispatchEvent(
      new PointerEvent(type, { clientX: x, clientY: y, pointerId: 1, bubbles: true, cancelable: true }),
    )

  window.tap = (x, y) => {
    document.dispatchEvent(new PointerEvent('pointerdown', { clientX: x, clientY: y, pointerId: 1, bubbles: true }))
    at('pointerdown', x, y)
    at('pointerup', x, y)
    document.dispatchEvent(new PointerEvent('pointerup', { clientX: x, clientY: y, pointerId: 1, bubbles: true }))
    return describe()
  }

  window.openHud = () => window.tap(window.innerWidth / 2, window.innerHeight / 2)

  // Drag along the ring, in screen coordinates.
  //
  // The moves are dispatched at the element the drag *started* on rather than
  // at whatever is under each point, which is what a captured pointer does for
  // real. Synthetic pointers cannot be captured — setPointerCapture throws
  // because the id is not an active pointer — so this stands in for it, and
  // the HUD's drags are written not to depend on capture succeeding.
  window.drag = (pts) => {
    const [x0, y0] = pts[0]
    const target = document.elementFromPoint(x0, y0)
    if (!target) throw new Error(`nothing at ${x0},${y0}`)
    const send = (type, x, y) =>
      target.dispatchEvent(
        new PointerEvent(type, { clientX: x, clientY: y, pointerId: 1, bubbles: true, cancelable: true }),
      )
    send('pointerdown', x0, y0)
    for (const [x, y] of pts.slice(1)) send('pointermove', x, y)
    const [xn, yn] = pts[pts.length - 1]
    send('pointerup', xn, yn)
    return target.getAttribute('class')
  }

  /** The horizontal midline of a layer row's own opacity bar, in screen
   *  coordinates — what a drag along that bar has to be aimed at. */
  window.barPoint = (layerIndex, t) => {
    const row = document.querySelectorAll('.hud-layer')[layerIndex]
    const bar = row.querySelector(':scope > .hud-bar')
    const r = bar.getBoundingClientRect()
    return [r.left + r.width * t, r.top + r.height / 2]
  }

  /** The colour bars inside the geometric row, same idea. */
  window.colourPoint = (channelIndex, t) => {
    const bar = document.querySelectorAll('.hud-colours .hud-bar')[channelIndex]
    const r = bar.getBoundingClientRect()
    return [r.left + r.width * t, r.top + r.height / 2]
  }

  // What is on screen, and whether any of it has escaped the viewport.
  window.describe = () => {
    const vw = window.innerWidth, vh = window.innerHeight
    const out = { viewport: [vw, vh], offscreen: [], layers: [], opts: [] }
    for (const row of document.querySelectorAll('.hud-layer')) {
      const r = row.getBoundingClientRect()
      out.layers.push({
        name: row.querySelector('.hud-layer-name').textContent,
        val: row.querySelector('.hud-layer-val').textContent,
        pct: row.querySelector('.hud-layer-top .hud-layer-pct').textContent,
        selected: row.getAttribute('aria-selected') === 'true',
        off: row.dataset.off === 'true',
        x: Math.round(r.left), y: Math.round(r.top),
        w: Math.round(r.width), h: Math.round(r.height),
      })
      if (r.left < -0.5 || r.top < -0.5 || r.right > vw + 0.5 || r.bottom > vh + 0.5) {
        out.offscreen.push(row.querySelector('.hud-layer-name').textContent)
      }
    }
    for (const b of document.querySelectorAll('.hud-opt')) {
      if (b.offsetParent === null) continue
      out.opts.push({ text: b.textContent, on: b.getAttribute('aria-pressed') === 'true' })
    }
    const panel = document.querySelector('.hud-panel')
    if (panel) {
      const r = panel.getBoundingClientRect()
      out.panel = { h: Math.round(r.height), top: Math.round(r.top), fits: r.top >= -0.5 }
    }
    out.calls = calls.slice(-6)
    out.prefs = {
      geoAlpha: prefs.geoAlpha, atmAlpha: prefs.atmAlpha, passthrough: prefs.passthrough,
      mix: prefs.mix, mapping: prefs.mapping, autopilot: prefs.autopilot, showStats: prefs.showStats,
    }
    return out
  }

  window.prefsRef = prefs
  document.getElementById('tag').textContent = `${window.innerWidth}x${window.innerHeight}`
  document.title = 'ready'
</script>
